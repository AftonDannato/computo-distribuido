events {}

http {


    upstream events_pool {
        server events-backend-1:8080 max_fails=3 fail_timeout=30s;
        server events-backend-2:8080 max_fails=3 fail_timeout=30s;
        server events-backend-3:8080 max_fails=3 fail_timeout=30s;
    }

    upstream detection_pool {
        server detection-backend-1:8080 max_fails=3 fail_timeout=30s;
        server detection-backend-2:8080 max_fails=3 fail_timeout=30s;
        server detection-backend-3:8080 max_fails=3 fail_timeout=30s;
    }

    upstream incidents_pool {
        server incidents-backend-1:8080 max_fails=3 fail_timeout=30s;
        server incidents-backend-2:8080 max_fails=3 fail_timeout=30s;
        server incidents-backend-3:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        location /events {
            proxy_pass http://events_pool;
        }

        location /detection {
            proxy_pass http://detection_pool;
        }

        location /incidents {
            proxy_pass http://incidents_pool;
        }

        location = /heartbeat {
            add_header Content-Type text/plain;
            return 200 "nginx gateway alive";
        }
        
    }
}