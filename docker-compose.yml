      db:
        condition: service_healthy
    networks:
      - microservices-net

  detection-backend-1:
    build: ./detection-backend
    environment:
      INSTANCE_ID: detection-1
      DATABASE_URL: "host=db port=5432 user=postgres password=postgres dbname=security_monitor sslmode=disable"
  # ports:
  #  - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices-net

  detection-backend-2:
