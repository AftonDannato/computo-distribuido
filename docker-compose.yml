services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_monitor
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
#   environment:
#     DATABASE_URL: "host=db port=5432 user=postgres password=postgres dbname=security_monitor sslmode=disable"
    ports:
      - "8080:8080"

  events-backend:
    build: ./events-backend
    environment:
      DATABASE_URL: "host=db port=5432 user=postgres password=postgres dbname=security_monitor sslmode=disable"
  # ports:
  #  - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: